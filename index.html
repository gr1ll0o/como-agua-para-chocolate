<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Como chocolate para agua?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <header>
        <h1><b>¿Como <span style="color: #6B292D;">chocolate</span> para <span style="color: #C56B45;">agua</span>?</b></h1>
        <p>¡Adiviná qué personaje dijo la frase!</p>
    </header>
    <div class="game">
        <div>
            <div class="phrase"><h2></h2></div>
            <div class="options">
                <button id="opt1"></button>
                <button id="opt2"></button>
                <button id="opt3"></button>
            </div>
        </div>
        <div class="score"><p>CORRECTAS: 0 | RÉCORD: 0</p></div>
    </div>
    <div class="credits">
        <p>Proyecto realizado por Giacobini, Grillo, López, Puga, Sayas de 4to 1ra.<br>
        TP de "Lengua y Literatura" del libro "Como Agua Para Chocolate" de Laura Esquivel.</p>
    </div>

    <div class="endgame">
        <div>
            <h2>¡Fin del juego!</h2>
            <div id="results"></div>
            <button id="restart">Volver a jugar</button>
        </div>
    </div>

    <script src="src/main.js"></script>
</body>
</html>

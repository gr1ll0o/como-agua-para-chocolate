    <title>¿Como chocolate para agua?</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>

    <div class="credits">
        <a class="github-link" href="https://github.com/gr1ll0o/como-agua-para-chocolate" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i></a><br>
        <p>Proyecto realizado por Giacobini, Grillo, López, Puga, Sayas de 4to 1ra.<br>

            <div id="results"></div>
